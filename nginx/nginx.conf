upstream odoo {
    server odoo:8069;
}

upstream odoochat {
    server odoo:8072;
}

# Redirigir HTTP a HTTPS
server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name _;

    # Certificados SSL (generados con Certbot o cargados manualmente)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Tamaño máximo de archivos adjuntos
    client_max_body_size 200m;

    # Logs
    access_log /var/log/nginx/odoo_access.log;
    error_log  /var/log/nginx/odoo_error.log;

    # Longpolling (chat y notificaciones en tiempo real)
    location /longpolling {
        proxy_pass http://odoochat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Odoo
    location / {
        proxy_pass http://odoo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Archivos estáticos con caché
    location ~* /web/static/ {
        proxy_pass http://odoo;
        proxy_set_header Host $host;
        proxy_cache_valid 200 90d;
        expires 864000;
    }

    # Bloquear acceso al gestor de BD desde internet
    location /web/database/ {
        deny all;
    }
}
