[options]
without_demo = all
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
lang = es_MX

; --- Seguridad ---
admin_passwd = CAMBIAR_POR_CONTRASEÑA_SEGURA
list_db = False

; --- Base de datos ---
; Debe coincidir con POSTGRES_DB del .env. Con list_db=False y sin esto,
; Odoo no sabe qué BD usar y falla con "database not found" al entrar por el dominio.
db_name = odoo
dbfilter = ^odoo$

; --- Nginx reverse proxy ---
proxy_mode = True

; --- Rendimiento ---
workers = 2
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 60
limit_time_real = 120
limit_time_real_cron = 600

; --- Logs ---
log_level = warn
